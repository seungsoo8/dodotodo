# 탑 수호자(games/tower)를 GitHub Pages 에 올린다.
# main 에 games/tower 가 바뀌어 올라오면 테스트 → 빌드 → 배포. Actions 탭에서 손으로 돌릴 수도 있다.
name: 탑 수호자 배포

on:
  push:
    branches: [main]
    paths:
      - 'games/tower/**'
      - '.github/workflows/tower-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 먼저 시작한 것은 끝까지 두고 뒤 것만 기다린다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # 저장소 페이지 주소 아래 /tower/ 에 게임을 두고, 첫 화면은 게임으로 넘긴다
      - name: 올릴 파일 모으기
        run: |
          mkdir -p ../../_site/tower
          cp index.html ../../_site/tower/
          cp -r dist ../../_site/tower/
          cat > ../../_site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./tower/">
          <title>탑 수호자</title>
          <a href="./tower/">탑 수호자로 이동</a>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}tower/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
