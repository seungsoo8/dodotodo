<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>탑 수호자 · 별이 떨어진 밤</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; touch-action: none; user-select: none; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; touch-action: none; }
      /* 폰을 세로로 들면 가로로 돌리라고 안내 (게임은 가로 화면 기준) */
      #rotate { display: none; position: fixed; inset: 0; background: #0b0d14; color: #c8d0e0; font-family: sans-serif; font-size: 18px; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 10; }
      @media (orientation: portrait) and (max-width: 900px) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
    <script type="module" src="./dist/main.js"></script>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="rotate"><div style="font-size: 40px">⟳</div><div>기기를 가로로 돌려주세요</div><div style="font-size: 12px; color: #8a94a8">탑 수호자는 가로 화면에 맞춰져 있어요</div></div>
  </body>
</html>
